<!doctype html><html lang="ru"><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:960px;height:540px;background:#161619;color:#f7f4ef;font-family:sans-serif}#root{width:100%;height:100%;position:relative;overflow:hidden}.scene{position:absolute;inset:0;padding:44px;display:grid;grid-template-columns:1fr 220px;align-items:center;gap:30px}.copy{display:grid;gap:20px}.badge{font-size:20px;color:#dfc4a6}h1{margin:0;font-size:42px;line-height:1.1;font-weight:700}p{font-size:22px;line-height:1.45;margin:0;color:#c8c3bc}img{width:200px;height:290px}.bar{height:4px;width:100%;background:#dfc4a6;transform-origin:left}.footer{position:absolute;left:44px;bottom:30px;font-size:16px;color:#c8c3bc}
</style></head><body><div id="root" data-composition-id="main" data-width="960" data-height="540" data-duration="4"><section class="scene clip" data-start="0" data-duration="4" data-track-index="0"><div class="copy"><span class="badge">ДЕМОНСТРАЦИЯ ИНТЕРФЕЙСА</span><h1>Пример упражнения</h1><p>Здесь будет ваш видеоурок. Это иллюстрация, а не обучение технике.</p><div class="bar"></div></div><img src="assets/illustration.svg" alt="Нейтральная иллюстрация"></section><span class="footer">Материал для тестирования шаблона</span></div><script>const tl=gsap.timeline({paused:true});tl.fromTo('.bar',{scaleX:0},{scaleX:1,duration:4,ease:'none'},0);window.__timelines['main']=tl;</script></body></html>
