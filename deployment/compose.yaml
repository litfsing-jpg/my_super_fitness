services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file: ../.env.local
    environment:
      WL_PORT: "4210"
      WL_BIND_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:4210:4210"
    volumes:
      - ../brand.config.json:/app/brand.config.json:ro
      - ../content/live:/app/content/live
      - ../content/media:/app/content/media:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
