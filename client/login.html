<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Вход</title><link rel="icon" href="/assets/neutral/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/login.css"><script src="/runtime-config.js"></script><script src="/vendor/supabase.js"></script><script src="/session-bridge.js"></script></head>
<body><header><a href="/"><img src="/assets/neutral/logo.svg" width="36" height="36" alt=""><span id="brandName"></span></a></header><main>
<span class="eyebrow">Личный кабинет</span><h1 id="authTitle">С возвращением</h1>
<div class="auth-tabs" role="group" aria-label="Вход и регистрация"><button type="button" data-mode="login" aria-pressed="true">Вход</button><button type="button" data-mode="register" aria-pressed="false">Регистрация</button></div>
<p id="authNotice" role="status" hidden></p>
<form id="authForm"><label id="emailLabel">Почта<input type="email" id="email" autocomplete="email" required maxlength="254"></label><label id="passwordLabel">Пароль<input type="password" id="password" autocomplete="current-password" required minlength="10" maxlength="128"></label><label class="consent" id="consent" hidden><input type="checkbox" id="accepted"><span>Принимаю <a href="/legal/offer" target="_blank" rel="noopener">условия сервиса</a> и <a href="/legal/privacy" target="_blank" rel="noopener">обработку данных</a>.</span></label><button type="submit" class="primary" id="submit">Войти</button></form>
<button type="button" class="text-button" id="recover">Забыли пароль?</button>
<button type="button" class="secondary" id="telegramLogin" hidden>Продолжить через Telegram</button>
<section id="accountChoice" hidden><h2>Уже есть аккаунт?</h2><p>Войди по почте, чтобы привязать Telegram к нему.</p><button class="secondary" type="button" id="existingAccount">Войти по почте</button><label class="consent"><input type="checkbox" id="telegramAccepted"><span>Принимаю <a href="/legal/offer">условия сервиса</a> и <a href="/legal/privacy">обработку данных</a>.</span></label><button type="button" class="primary" id="createTelegram">Создать аккаунт</button></section>
<section id="subscription" hidden><h2>Доступ к платформе</h2><p id="accessStatus"></p><div id="plans"></div><button class="secondary" type="button" id="checkPayment">Проверить доступ</button><button class="text-button" type="button" id="linkTelegram">Привязать Telegram</button><a id="linkBot" hidden>Продолжить в боте</a><button class="text-button" type="button" id="logout">Выйти</button></section>
</main><footer><a href="/legal/offer">Оферта</a><a href="/legal/privacy">Конфиденциальность</a><a href="/legal/consent">Согласие</a></footer><script type="module" src="/login.mjs"></script></body></html>
